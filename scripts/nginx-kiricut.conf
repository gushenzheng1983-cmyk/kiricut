# KiriCut nginx — HTTP (port 80)
# Domain: kiricut.net / www.kiricut.net → VPS 206.119.182.153
# HTTPS: after DNS is correct, run on VPS:
#   certbot --nginx -d kiricut.net -d www.kiricut.net --non-interactive --agree-tos -m YOU@EMAIL --redirect
# Or use 阿里云证书 + listen 443 ssl (see docs/DEPLOYMENT.md)

server {
    listen 80 default_server;
    server_name kiricut.net www.kiricut.net;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
